name: CI/CD Pipeline & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 靜態校驗 + 自動化單元測試
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Test Dependencies
        run: npm install --no-audit

      - name: Run Physics Benchmark Tests
        run: npm test

      - name: Verify Critical Project Files
        run: |
          REQUIRED_FILES=(
            "index.html" "manifest.json" "service-worker.js"
            "src/main.js" "src/core/ConfigManager.js"
            "src/core/MainController.js" "src/kinematics/ArmBuilder.js"
            "src/physics/InertiaCalculator.js"
            "src/physics/HomogenizationEngine.js"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ 缺失核心檔案: $file"
              exit 1
            fi
          done
          echo "✅ 核心檔案校驗通過"

      - name: Package Release Artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r beyond-the-hand-${{ github.ref_name }}.zip . \
            -x "*.git*" ".github/*" "node_modules/*"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: beyond-the-hand-${{ github.ref_name }}.zip

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # ============================================================
  # Job 2: 部署至 GitHub Pages
  # ============================================================
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for Tagging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Deployment Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          git tag -a "deploy-$TIMESTAMP" -m "Automated deployment on $TIMESTAMP"
          git push origin "deploy-$TIMESTAMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 3: GitHub Release (推送 v* Tag 時自動建立)
  # ============================================================
  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: beyond-the-hand-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 4: PR 自動留言報告
  # ============================================================
  pr-feedback:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ⚡ J.A.R. CI 驗證通過\n\n- ✅ **核心模組校驗**: 所有檔案結構皆完整\n- ✅ **物理基準測試**: \`InertiaCalculator\` 通過解析解驗證\n- 🚀 **部署準備**: 合併到 \`main\` 後將自動發布至 GitHub Pages！`
            });
