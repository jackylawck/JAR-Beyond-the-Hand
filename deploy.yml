name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 驗證與構建 (運行喺 PR 同 push)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'                              # 🔒 鎖定版本
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g eslint
          echo "✅ 依賴安裝完成"

      - name: Lint JavaScript
        run: |
          npx eslint src/**/*.js --max-warnings=0 || echo "⚠️ Lint 警告，但繼續部署"
        continue-on-error: true

      - name: Verify critical files exist
        run: |
          for file in index.html manifest.json service-worker.js src/main.js; do
            if [ ! -f "$file" ]; then
              echo "❌ 缺失必要檔案: $file"
              exit 1
            fi
          done
          echo "✅ 所有必要檔案存在"

      - name: Upload build artifact (for PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.number }}
          path: '.'

      - name: Upload Pages artifact (for production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # ============================================================
  # Job 2: 部署到 GitHub Pages (只喺 main branch push 時執行)
  # ============================================================
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment tag
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          git tag "deploy-$TIMESTAMP"
          git push origin "deploy-$TIMESTAMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 3: 部署預覽評論 (PR 自動留言)
  # ============================================================
  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download PR artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ github.event.number }}
          path: ./preview

      - name: Deploy to PR preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          destination_dir: pr-${{ github.event.number }}
          keep_files: false

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.issue.number}/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **PR Preview 已部署！**\n\n點擊連結預覽改動：\n🔗 ${url}\n\n（此為自動部署，僅供測試用途）`
            });
