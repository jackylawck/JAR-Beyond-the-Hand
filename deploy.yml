name: CI/CD Pipeline & GitHub Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 靜態檢查與檔案完整性驗證 (Lint & File Integrity)
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Critical Project Files
        run: |
          echo "🔍 檢查核心架構檔案..."
          REQUIRED_FILES=(
            "index.html"
            "manifest.json"
            "service-worker.js"
            "css/style.css"
            "src/main.js"
            "src/core/ConfigManager.js"
            "src/core/SceneManager.js"
            "src/core/MainController.js"
            "src/kinematics/ArmBuilder.js"
            "src/kinematics/CCDIKSolver.js"
            "src/physics/InertiaCalculator.js"
            "src/physics/HomogenizationEngine.js"
            "src/physics/MultibodyDynamics.js"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ 嚴重錯誤: 缺失必要模組 $file"
              exit 1
            fi
          done
          echo "✅ 核心模組完整性驗證通過！"

      - name: Quick ES Syntax Validation
        run: |
          node --check src/main.js
          echo "✅ main.js 語法正確"

      - name: Upload Artifact for Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # ============================================================
  # Job 2: 部署到 GitHub Pages (僅 main 分支推送觸發)
  # ============================================================
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout for Tagging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release Audit Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          git tag -a "deploy-$TIMESTAMP" -m "Automated deployment on $TIMESTAMP"
          git push origin "deploy-$TIMESTAMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Job 3: PR 驗證回饋 (自動在 PR 留下檢查報告)
  # ============================================================
  pr-feedback:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ⚡ J.A.R. CI 驗證通過\n\n- ✅ **核心模組校驗**: 所有檔案結構皆完整\n- ✅ **JS 語法檢查**: 通過 Node.js 20 解析\n- 🚀 **部署準備**: 合併到 \`main\` 後將自動發布至 GitHub Pages！`
            });
