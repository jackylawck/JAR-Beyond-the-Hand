    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "J.A.R. Beyond the Hand 3D",
      "alternateName": "J.A.R. 在手之上 3D - 聯合應用科學探索",

      "applicationCategory": "EducationalApplication, SimulationApplication",
      "operatingSystem": "All"
    }

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self'; img-src 'self' data: blob:;">

    <link rel="icon" type="image/png" sizes="512x512" href="jarBeyondtheHand512icon.png">

    <!-- 強制載入最新 CSS -->
    <link rel="stylesheet" href="css/style.css?v=2026.99">

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <!-- 模式選擇器 Modal -->
    <div id="mode-selector">
        <h2 id="modal-title">⚡ 切換任務模式</h2>
        <p id="modal-desc">請選擇即將載入的自動化領域</p>
        <div class="mode-cards-wrap">
            <div class="mode-card" data-mode="kid">
                <div class="icon">🍓</div>
                <h3 id="mode-opt-kid-title">兒童模式</h3>
                <p id="mode-opt-kid-desc">農業精準採摘</p>
            </div>
            <div class="mode-card" data-mode="advanced">
                <div class="icon">📱</div>
                <h3 id="mode-opt-adv-title">進階模式</h3>
                <p id="mode-opt-adv-desc">3C 精密組裝</p>
            </div>
            <div class="mode-card" data-mode="research">
                <div class="icon">🧪</div>
                <h3 id="mode-opt-res-title">科研模式</h3>
                <p id="mode-opt-res-desc">實驗室自動化</p>
            </div>
        </div>
        <button id="btn-close-modal">關閉</button>
    </div>

    <!-- 3D 渲染容器 -->
    <div id="canvas-container"></div>
    
    <!-- 🌟 左上角獨立精巧 HUD -->
    <div id="hud">
        <div class="hud-header">
            <div class="hud-title" id="app-hud-title">⚡ J.A.R. 在手之上 3D</div>
            <div class="header-controls">
                <button id="btn-switch-mode" class="lang-btn">🔀 切換模式</button>
                <button id="lang-btn" class="lang-btn">🌐 EN / 中文</button>
                <div id="status-tag" class="hud-status">系統就緒</div>
            </div>
        </div>
        <div class="mission-card">
            <div id="mission-title" class="mission-title">載入中...</div>
            <div id="mission-desc" class="mission-desc">請操作機械臂</div>
            <div id="view-hint" class="view-hint">💡 滑動旋轉視角 ｜ PC: WASD+QE+SPACE</div>
        </div>
    </div>

    <!-- 🌟 J.A.R. AI 對話視窗 -->
    <div id="jar-dialogue">
        <div id="jar-title">
            <span id="jar-title-text">J.A.R. 系統助理</span>
            <span id="jar-status-tag" class="online-tag">在線</span>
        </div>
        <div id="jar-text">...</div>
    </div>

    <!-- 雙搖桿與動作按鈕 -->
    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone"><div id="knob-left" class="joy-knob"></div></div>
        <div id="joy-right" class="joystick-zone"><div id="knob-right" class="joy-knob"></div></div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
