<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R. 在手之上 3D ｜ J.A.R. LAB</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #060a12; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; touch-action: none; }

        /* 電影級暗角與微掃描線 */
        body::after {
            content: ""; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at center, transparent 50%, rgba(2, 6, 12, 0.85) 100%),
                        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 229, 255, 0.015) 3px);
            pointer-events: none; z-index: 5;
        }

        /* 全息 HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 18px; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.7); z-index: 10;
        }
        .hud-header { display: flex; justify-content: space-between; align-items: center; }
        .hud-title { font-size: 16px; font-weight: 800; letter-spacing: 2px; }
        .header-controls { display: flex; gap: 8px; pointer-events: auto; }
        .lang-btn {
            background: rgba(0, 229, 255, 0.15); border: 1px solid #00e5ff;
            color: #00e5ff; font-size: 11px; font-weight: bold; padding: 4px 10px;
            border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        .lang-btn:active { background: #00e5ff; color: #040810; }
        .hud-status {
            font-size: 11px; background: rgba(0, 229, 255, 0.12); border: 1px solid #00e5ff;
            padding: 4px 10px; border-radius: 4px; font-family: monospace;
        }
        .mission-card {
            background: rgba(4, 12, 24, 0.88); border-left: 3px solid #ff9100;
            padding: 12px 16px; border-radius: 0 8px 8px 0; max-width: 340px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            pointer-events: auto;
        }
        .mission-title { color: #ff9100; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        .mission-desc { font-size: 13px; color: #fff; margin-top: 3px; font-weight: 600; }
        .view-hint { font-size: 10px; color: #8899aa; margin-top: 4px; }

        /* 虛擬搖桿與操作鍵 */
        .controls-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        .joystick-zone {
            position: absolute; bottom: 25px; width: 130px; height: 130px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08), rgba(0, 229, 255, 0.01));
            border: 1px dashed rgba(0, 229, 255, 0.4); border-radius: 50%;
            pointer-events: auto; touch-action: none;
        }
        #joy-left { left: 25px; }
        #joy-right { right: 25px; }
        .joy-knob {
            width: 46px; height: 46px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #00e5ff, #005f6b);
            position: absolute; top: 42px; left: 42px; pointer-events: none;
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .action-btn {
            position: absolute; bottom: 175px; right: 35px; width: 68px; height: 68px;
            border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff4d00, #7a1200);
            border: 2px solid #ff9100; color: #fff; font-weight: 800; font-size: 12px;
            pointer-events: auto; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(255, 61, 0, 0.6); cursor: pointer;
        }
        .action-btn:active { transform: scale(0.92); }
    </style>
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-header">
            <div class="hud-title">⚡ J.A.R. LAB // ARM-01</div>
            <div class="header-controls">
                <button id="lang-btn" class="lang-btn">🌐 EN / 中文</button>
                <div id="status-tag" class="hud-status">SYSTEM READY</div>
            </div>
        </div>
        <div class="mission-card">
            <div id="mission-title" class="mission-title">MISSION 01: 量子核心裝配</div>
            <div id="mission-desc" class="mission-desc">🎯 移向前方量子能量核心</div>
            <div id="view-hint" class="view-hint">💡 360° 拖曳視角 / 雙指縮放觀察工業細節</div>
        </div>
        <div></div>
    </div>

    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone"><div id="knob-left" class="joy-knob"></div></div>
        <div id="joy-right" class="joystick-zone"><div id="knob-right" class="joy-knob"></div></div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <script>
    /* =========================================================================
       1. 雙語字典
       ========================================================================= */
    const I18N = {
        zh: {
            title: "⚡ J.A.R. LAB // ARM-01",
            statusReady: "系統就緒",
            statusSecured: "核心已鎖定",
            statusComplete: "裝配完成 🎉",
            missionHeader: "MISSION 01: 量子核心裝配",
            step1: "🎯 移向前方發光核心",
            step2: "🟢 按下 GRIP 抓取！",
            step3: "➡️ 移動至右側基座槽位",
            step4: "✅ 釋放 GRIP 完成安裝！",
            viewHint: "💡 360° 拖曳視角 / 雙指縮放觀察工業細節",
            gripBtn: "抓取"
        },
        en: {
            title: "⚡ J.A.R. LAB // ARM-01",
            statusReady: "SYSTEM READY",
            statusSecured: "CORE SECURED",
            statusComplete: "MISSION COMPLETE 🎉",
            missionHeader: "MISSION 01: QUANTUM CORE DOCKING",
            step1: "🎯 Move towards the glowing core",
            step2: "🟢 Press GRIP to capture!",
            step3: "➡️ Move towards the docking socket",
            step4: "✅ Release GRIP to dock!",
            viewHint: "💡 Drag to orbit 360° / Pinch to zoom industrial details",
            gripBtn: "GRIP"
        }
    };
    let currentLang = 'zh';

    function updateLanguage() {
        const dict = I18N[currentLang];
        document.querySelector('.hud-title').innerText = dict.title;
        document.getElementById('mission-title').innerText = dict.missionHeader;
        document.getElementById('view-hint').innerText = dict.viewHint;
        document.getElementById('btn-grip').innerText = dict.gripBtn;
        document.getElementById('status-tag').innerText = isDelivered ? dict.statusComplete : (isSecured ? dict.statusSecured : dict.statusReady);
    }
    document.getElementById('lang-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        updateLanguage();
    });

    /* =========================================================================
       2. Web Audio 音效引擎
       ========================================================================= */
    class AudioEngine {
        constructor() { this.ctx = null; this.motorGain = null; this.motorOsc = null; }
        init() {
            if (this.ctx) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
            this.motorOsc = this.ctx.createOscillator();
            this.motorGain = this.ctx.createGain();
            this.motorOsc.type = 'triangle';
            this.motorOsc.frequency.setValueAtTime(50, this.ctx.currentTime);
            this.motorGain.gain.setValueAtTime(0, this.ctx.currentTime);
            this.motorOsc.connect(this.motorGain);
            this.motorGain.connect(this.ctx.destination);
            this.motorOsc.start();
        }
        setMotorPitch(speed) {
            if (!this.ctx) return;
            this.motorGain.gain.setTargetAtTime(Math.min(speed * 0.12, 0.06), this.ctx.currentTime, 0.05);
            this.motorOsc.frequency.setTargetAtTime(45 + speed * 120, this.ctx.currentTime, 0.05);
        }
        playPneumatic() {
            if (!this.ctx) return;
            const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.08, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass'; filter.frequency.value = 2400;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            noise.start();
        }
        playSuccess() {
            if (!this.ctx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + idx * 0.08);
                osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
            });
        }
    }

    /* =========================================================================
       3. 核心 3A 場景生成 (高科技實驗室環境 + 真 PBR 金屬反射)
       ========================================================================= */
    const audio = new AudioEngine();
    let scene, camera, renderer, controls;
    let ikBones = [], targetPos = new THREE.Vector3(0, 1.9, 1.5);
    let endEffector, clawLeft, clawRight;
    let reactorCore, reactorSocket, coreGlow;
    let clawOpen = true, isSecured = false, isDelivered = false;

    const inputState = { lx: 0, ly: 0, rx: 0, ry: 0 };
    const POOL = {
        v1: new THREE.Vector3(), v2: new THREE.Vector3(),
        forward: new THREE.Vector3(), right: new THREE.Vector3(),
        toEnd: new THREE.Vector3(), toTarget: new THREE.Vector3(), cross: new THREE.Vector3()
    };

    // 動態生成 360° 工業實驗室環境反射貼圖 (CubeMap)
    function createStudioEnvironment(renderer) {
        const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
            format: THREE.RGBFormat,
            generateMipmaps: true,
            minFilter: THREE.LinearMipmapLinearFilter
        });
        const cubeCamera = new THREE.CubeCamera(0.1, 50, cubeRenderTarget);
        const envScene = new THREE.Scene();

        // 模擬科技天花板冷光燈管條
        const lightGeo = new THREE.BoxGeometry(2, 0.2, 10);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const strip1 = new THREE.Mesh(lightGeo, lightMat);
        strip1.position.set(4, 8, 0);
        envScene.add(strip1);
        const strip2 = new THREE.Mesh(lightGeo, lightMat);
        strip2.position.set(-4, 8, 0);
        envScene.add(strip2);

        // 藍色全息牆面反射
        const wallGeo = new THREE.PlaneGeometry(20, 10);
        const blueWallMat = new THREE.MeshBasicMaterial({ color: 0x003366 });
        const wallBack = new THREE.Mesh(wallGeo, blueWallMat);
        wallBack.position.set(0, 5, -10);
        envScene.add(wallBack);

        cubeCamera.update(renderer, envScene);
        return cubeRenderTarget.texture;
    }

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x060a12, 0.025);

        camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3.8, 5.5);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 360° 軌道控制器
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 1.1, 0.4);
        controls.maxPolarAngle = Math.PI / 2 + 0.05;
        controls.minDistance = 2.0;
        controls.maxDistance = 9.0;

        // 生成環境反射 (IBL)
        const envTexture = createStudioEnvironment(renderer);
        scene.environment = envTexture;

        buildLighting();
        buildStudioLab();
        buildIndustrialArm();
        buildInteractiveObjects();
        setupControls();

        window.addEventListener('resize', onWindowResize, false);
    }

    function buildLighting() {
        scene.add(new THREE.AmbientLight(0x1a2636, 1.8));

        // 主金屬聚光燈 (帶陰影)
        const mainSpot = new THREE.SpotLight(0xffffff, 4.5, 18, Math.PI / 3.5, 0.4, 1.2);
        mainSpot.position.set(3, 7, 4);
        mainSpot.castShadow = true;
        mainSpot.shadow.mapSize.width = 1024;
        mainSpot.shadow.mapSize.height = 1024;
        mainSpot.shadow.bias = -0.001;
        scene.add(mainSpot);

        // 輪廓邊緣藍冷光 (Rim Light)
        const rimLight = new THREE.DirectionalLight(0x00e5ff, 3.2);
        rimLight.position.set(-6, 5, -5);
        scene.add(rimLight);

        // 底部回火暖橙補光
        const warmBounce = new THREE.DirectionalLight(0xff7700, 1.2);
        warmBounce.position.set(4, -2, 2);
        scene.add(warmBounce);
    }

    // 建立 3A 級高科技車間實驗室場景
    function buildStudioLab() {
        // 1. 工業防滑地台與下沉式散熱導流槽
        const floorGeo = new THREE.CylinderGeometry(3.2, 3.4, 0.2, 48);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x11161d, metalness: 0.9, roughness: 0.35 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.1;
        floor.receiveShadow = true;
        scene.add(floor);

        // 外圍全息刻度環
        const grid = new THREE.GridHelper(16, 32, 0x00e5ff, 0x112233);
        grid.position.y = 0.01;
        scene.add(grid);

        // 2. 下沉式同心圓能量導流光環 (3 層階梯光槽)
        for (let i = 0; i < 3; i++) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(0.85 + i * 0.55, 0.012, 8, 64),
                new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.5 - i * 0.12 })
            );
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.02;
            scene.add(ring);
        }

        // 3. 原創 J.A.R. 全息地台文字投影
        const labelSprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: (() => {
                    const c = document.createElement('canvas');
                    c.width = 512; c.height = 128;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = 'transparent'; ctx.fillRect(0, 0, 512, 128);
                    ctx.font = '800 38px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18;
                    ctx.fillStyle = '#00e5ff';
                    ctx.fillText('⚡ J.A.R. ROBOTICS // LAB-01', 256, 64);
                    return new THREE.CanvasTexture(c);
                })(),
                transparent: true, depthWrite: false
            })
        );
        labelSprite.position.set(0, 0.06, 1.6);
        labelSprite.scale.set(1.4, 0.35, 1);
        scene.add(labelSprite);
    }

    // 構建高精細度工業級多關節機械臂 (雙骨架 + 液壓活塞 + 外露齒輪)
    function buildIndustrialArm() {
        // 程序化拉絲金屬微刮痕貼圖 (Zero-Asset)
        const scratchTex = (() => {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#555555'; ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 200; i++) {
                ctx.strokeStyle = `rgba(0,0,0,${0.1 + Math.random()*0.2})`;
                ctx.lineWidth = 1 + Math.random();
                ctx.beginPath();
                const x = Math.random()*256, y = Math.random()*256;
                ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()-0.5)*30, y + (Math.random()-0.5)*30);
                ctx.stroke();
            }
            const t = new THREE.CanvasTexture(c);
            t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2);
            return t;
        })();

        // 次世代 PBR 金屬材質
        const matGold = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.92, roughness: 0.22, roughnessMap: scratchTex });
        const matRed = new THREE.MeshStandardMaterial({ color: 0x8a0f0f, metalness: 0.88, roughness: 0.24, roughnessMap: scratchTex });
        const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x1c222b, metalness: 0.96, roughness: 0.28, roughnessMap: scratchTex });
        const matChrome = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 1.0, roughness: 0.08 });
        const matCyanGlow = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        // ===== 1. 基座總成 (Base Yaw) =====
        const baseGroup = new THREE.Group();
        baseGroup.position.set(0, 0, 0);
        scene.add(baseGroup);

        // 重型外殼
        const baseArmor = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.72, 0.28, 32), matRed);
        baseArmor.position.y = 0.14;
        baseArmor.castShadow = true; baseArmor.receiveShadow = true;
        baseGroup.add(baseArmor);

        // 旋轉法蘭盤
        const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.06, 32), matDarkSteel);
        flange.position.y = 0.31;
        baseGroup.add(flange);

        // 關節 0: Base Yaw (水平迴轉)
        const joint0 = new THREE.Group();
        joint0.position.set(0, 0.34, 0);
        baseGroup.add(joint0);
        ikBones.push({ obj: joint0, axis: 'Y', min: -Math.PI, max: Math.PI });

        // 雙側重型絞鏈立柱 (Fork Support)
        const forkL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.32), matDarkSteel);
        forkL.position.set(-0.25, 0.18, 0);
        forkL.castShadow = true; joint0.add(forkL);

        const forkR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 0.32), matDarkSteel);
        forkR.position.set(0.25, 0.18, 0);
        forkR.castShadow = true; joint0.add(forkR);

        // ===== 2. 肩關節 (Shoulder Pitch) =====
        const joint1 = new THREE.Group();
        joint1.position.set(0, 0.35, 0);
        joint0.add(joint1);
        ikBones.push({ obj: joint1, axis: 'X', min: -Math.PI * 0.45, max: Math.PI * 0.45 });

        // 旋轉中軸
        const shoulderAxis = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.5, 24), matChrome);
        shoulderAxis.rotation.z = Math.PI / 2;
        joint1.add(shoulderAxis);

        // 大臂雙骨架裝甲
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.15, 0.16), matGold);
        armL.position.set(-0.14, 0.58, 0);
        armL.castShadow = true; joint1.add(armL);

        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.15, 0.16), matGold);
        armR.position.set(0.14, 0.58, 0);
        armR.castShadow = true; joint1.add(armR);

        // 液壓活塞桿總成 (Hydraulic Actuator)
        const pistonBase = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.75, 16), matDarkSteel);
        pistonBase.position.set(0, 0.42, -0.09);
        pistonBase.castShadow = true; joint1.add(pistonBase);

        const pistonRod = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.7, 16), matChrome);
        pistonRod.position.set(0, 0.8, -0.09);
        joint1.add(pistonRod);

        // ===== 3. 肘關節 (Elbow Pitch) =====
        const joint2 = new THREE.Group();
        joint2.position.set(0, 1.15, 0);
        joint1.add(joint2);
        ikBones.push({ obj: joint2, axis: 'X', min: -Math.PI * 0.75, max: 0.05 });

        // 外露高精度減速齒輪盤
        const elbowGear = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.4, 24), matDarkSteel);
        elbowGear.rotation.z = Math.PI / 2;
        joint2.add(elbowGear);

        // 小臂流線型八角裝甲板
        const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.92, 8), matRed);
        forearm.position.set(0, 0.46, 0);
        forearm.castShadow = true; joint2.add(forearm);

        // ===== 4. 腕部與夾爪 (Wrist & Heavy Gripper) =====
        const joint3 = new THREE.Group();
        joint3.position.set(0, 0.92, 0);
        joint2.add(joint3);
        ikBones.push({ obj: joint3, axis: 'X', min: -Math.PI * 0.5, max: Math.PI * 0.5 });

        const wristServo = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.13, 16), matDarkSteel);
        joint3.add(wristServo);

        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.09, 0.2), matGold);
        palm.position.set(0, 0.08, 0);
        palm.castShadow = true; joint3.add(palm);

        const palmArc = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.02, 16), matCyanGlow);
        palmArc.rotation.x = Math.PI / 2;
        palmArc.position.set(0, 0.08, 0.1);
        joint3.add(palmArc);

        // 重裝工業防滑夾爪
        const clawBase = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.06, 0.12), matDarkSteel);
        clawBase.position.set(0, 0.12, 0);
        joint3.add(clawBase);

        // 左爪 + 防滑墊
        clawLeft = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.24, 0.09), matChrome);
        clawLeft.position.set(-0.1, 0.23, 0);
        clawLeft.castShadow = true; joint3.add(clawLeft);

        const padL = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.12, 0.07), matRed);
        padL.position.set(-0.08, 0.23, 0.02);
        joint3.add(padL);

        // 右爪 + 防滑墊
        clawRight = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.24, 0.09), matChrome);
        clawRight.position.set(0.1, 0.23, 0);
        clawRight.castShadow = true; joint3.add(clawRight);

        const padR = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.12, 0.07), matRed);
        padR.position.set(0.08, 0.23, 0.02);
        joint3.add(padR);

        endEffector = new THREE.Group();
        endEffector.position.set(0, 0.36, 0);
        joint3.add(endEffector);
    }

    // 建立發光量子核心與裝配槽位
    function buildInteractiveObjects() {
        const socketGroup = new THREE.Group();
        socketGroup.position.set(0.85, 0.02, 0.85);
        scene.add(socketGroup);

        reactorSocket = new THREE.Mesh(
            new THREE.CylinderGeometry(0.34, 0.38, 0.16, 24),
            new THREE.MeshStandardMaterial({ color: 0x1c222b, metalness: 0.95, roughness: 0.25 })
        );
        reactorSocket.position.y = 0.08;
        reactorSocket.castShadow = true;
        socketGroup.add(reactorSocket);

        const glowRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.25, 0.016, 8, 32),
            new THREE.MeshBasicMaterial({ color: 0xff6600 })
        );
        glowRing.rotation.x = Math.PI / 2;
        glowRing.position.y = 0.165;
        socketGroup.add(glowRing);

        // 量子核心總成 (發光環 + 鍍鉻外殼)
        reactorCore = new THREE.Group();
        const coreBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.15, 0.15, 0.2, 16),
            new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.1 })
        );
        coreGlow = new THREE.Mesh(
            new THREE.TorusGeometry(0.12, 0.035, 12, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ffff })
        );
        coreGlow.rotation.x = Math.PI / 2;

        const coreCaps = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.035, 16), new THREE.MeshStandardMaterial({ color: 0xf5f5f5, metalness: 1.0, roughness: 0.1 }));
        coreCaps.position.y = 0.1;

        reactorCore.add(coreBody);
        reactorCore.add(coreGlow);
        reactorCore.add(coreCaps);
        reactorCore.position.set(-0.85, 0.25, 0.85);
        reactorCore.castShadow = true;
        scene.add(reactorCore);
    }

    /* =========================================================================
       4. 操控、逆運動學與任務邏輯
       ========================================================================= */
    function setupControls() {
        bindJoy('joy-left', 'knob-left', (x, y) => {
            inputState.lx = x; inputState.ly = y;
            controls.enabled = (Math.hypot(x, y) === 0);
        });
        bindJoy('joy-right', 'knob-right', (x, y) => {
            inputState.rx = x; inputState.ry = y;
            controls.enabled = (Math.hypot(x, y) === 0);
        });
        document.getElementById('btn-grip').addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            toggleGrip();
        });
    }

    function bindJoy(zoneId, knobId, onChange) {
        const zone = document.getElementById(zoneId);
        const knob = document.getElementById(knobId);
        const maxR = 45;
        let activeId = null;

        zone.addEventListener('pointerdown', (e) => {
            audio.init();
            activeId = e.pointerId;
            zone.setPointerCapture(e.pointerId);
            update(e);
        });
        zone.addEventListener('pointermove', (e) => { if (e.pointerId === activeId) update(e); });
        const reset = (e) => {
            if (e.pointerId === activeId) {
                activeId = null;
                knob.style.transform = `translate(0, 0)`;
                onChange(0, 0);
            }
        };
        zone.addEventListener('pointerup', reset);
        zone.addEventListener('pointercancel', reset);

        function update(e) {
            const rect = zone.getBoundingClientRect();
            let dx = e.clientX - (rect.left + rect.width / 2);
            let dy = e.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            const nx = dx / maxR, ny = dy / maxR;
            const dz = 0.12;
            const fx = Math.abs(nx) < dz ? 0 : Math.sign(nx) * Math.pow((Math.abs(nx) - dz) / (1 - dz), 2);
            const fy = Math.abs(ny) < dz ? 0 : Math.sign(ny) * Math.pow((Math.abs(ny) - dz) / (1 - dz), 2);
            onChange(fx, fy);
        }
    }

    function toggleGrip() {
        audio.init();
        audio.playPneumatic();
        clawOpen = !clawOpen;

        endEffector.getWorldPosition(POOL.v1);
        const dist = POOL.v1.distanceTo(reactorCore.position);

        if (!clawOpen && dist < 0.45 && !isDelivered) {
            isSecured = true;
            document.getElementById('status-tag').innerText = I18N[currentLang].statusSecured;
            document.getElementById('status-tag').style.background = "rgba(0, 229, 255, 0.25)";
        } else if (clawOpen && isSecured) {
            const socketDist = POOL.v1.distanceTo(reactorSocket.position);
            if (socketDist < 0.38) {
                isDelivered = true;
                isSecured = false;
                reactorCore.position.set(0.85, 0.26, 0.85);
                audio.playSuccess();
                document.getElementById('status-tag').innerText = I18N[currentLang].statusComplete;
                document.getElementById('status-tag').style.background = "rgba(0, 255, 100, 0.2)";
                document.getElementById('status-tag').style.borderColor = "#00ff66";
            } else {
                isSecured = false;
                document.getElementById('status-tag').innerText = I18N[currentLang].statusReady;
            }
        }
    }

    function solveIK(target) {
        for (let iter = 0; iter < 3; iter++) {
            for (let i = ikBones.length - 1; i >= 0; i--) {
                const bone = ikBones[i];
                bone.obj.getWorldPosition(POOL.v1);
                endEffector.getWorldPosition(POOL.v2);

                POOL.toEnd.subVectors(POOL.v2, POOL.v1).normalize();
                POOL.toTarget.subVectors(target, POOL.v1).normalize();

                let angle = POOL.toEnd.dot(POOL.toTarget);
                angle = Math.acos(Math.max(-1, Math.min(1, angle)));

                if (angle > 0.001) {
                    POOL.cross.crossVectors(POOL.toEnd, POOL.toTarget).normalize();
                    let currentRot = (bone.axis === 'Y') ? bone.obj.rotation.y : bone.obj.rotation.x;
                    let targetDelta = (bone.axis === 'Y' ? POOL.cross.y : POOL.cross.x) * angle * 0.7;
                    targetDelta = Math.max(-0.12, Math.min(0.12, targetDelta));
                    let nextRot = Math.max(bone.min, Math.min(bone.max, currentRot + targetDelta));

                    if (bone.axis === 'Y') bone.obj.rotation.y = nextRot;
                    else bone.obj.rotation.x = nextRot;
                    bone.obj.updateMatrixWorld(true);
                }
            }
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* =========================================================================
       5. 主動畫迴圈
       ========================================================================= */
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        // 核心呼吸光
        if (coreGlow) {
            const pulse = 1.0 + Math.sin(Date.now() * 0.005) * 0.15;
            coreGlow.scale.set(pulse, pulse, pulse);
        }

        // 操控映射 (基於當前視角)
        camera.getWorldDirection(POOL.forward);
        POOL.forward.y = 0; POOL.forward.normalize();
        POOL.right.crossVectors(POOL.forward, camera.up).normalize().negate();

        const moveSpeed = 1.9 * dt;
        POOL.v1.copy(POOL.forward).multiplyScalar(-inputState.ly * moveSpeed);
        POOL.v2.copy(POOL.right).multiplyScalar(inputState.lx * moveSpeed);
        targetPos.add(POOL.v1).add(POOL.v2);
        targetPos.y -= inputState.ry * moveSpeed;

        if (targetPos.y < 0.32) targetPos.y = 0.32;
        if (targetPos.y > 2.6) targetPos.y = 2.6;
        const radius = Math.hypot(targetPos.x, targetPos.z);
        if (radius > 2.2) {
            targetPos.x = (targetPos.x / radius) * 2.2;
            targetPos.z = (targetPos.z / radius) * 2.2;
        }

        // 磁吸與引導提示
        endEffector.getWorldPosition(POOL.v1);
        const guidanceEl = document.getElementById('mission-desc');
        const dict = I18N[currentLang];

        if (!isSecured && !isDelivered) {
            const distToCore = POOL.v1.distanceTo(reactorCore.position);
            if (distToCore > 0.45) {
                guidanceEl.innerText = dict.step1;
                guidanceEl.style.color = "#00e5ff";
            } else {
                guidanceEl.innerText = dict.step2;
                guidanceEl.style.color = "#00ff66";
                targetPos.lerp(reactorCore.position, 6.0 * dt);
            }
        } else if (isSecured) {
            reactorCore.position.lerp(POOL.v1, 14.0 * dt);
            const distToSocket = POOL.v1.distanceTo(reactorSocket.position);
            if (distToSocket > 0.38) {
                guidanceEl.innerText = dict.step3;
                guidanceEl.style.color = "#ff9100";
            } else {
                guidanceEl.innerText = dict.step4;
                guidanceEl.style.color = "#00ff66";
            }
            if (distToSocket < 0.34) {
                targetPos.lerp(reactorSocket.position, 5.0 * dt);
            }
        }

        solveIK(targetPos);

        const targetOffset = clawOpen ? 0.08 : 0.01;
        clawLeft.position.x += (-0.06 - targetOffset - clawLeft.position.x) * 0.25;
        clawRight.position.x += (0.06 + targetOffset - clawRight.position.x) * 0.25;

        audio.setMotorPitch(Math.hypot(inputState.lx, inputState.ly, inputState.rx, inputState.ry));
        controls.update();

        renderer.render(scene, camera);
    }

    window.onload = () => { init(); animate(); };
    </script>
