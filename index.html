<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R. 在手之上 3D ｜ Beyond the Hand 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- 啟動過渡畫面 -->
    <div id="splash-screen">
        <h1 class="splash-title">⚡ J.A.R. LAB</h1>
        <p class="splash-sub">BEYOND THE HAND 3D</p>
        <div class="splash-spinner"></div>
        <p class="splash-status">INITIALIZING SYSTEMS...</p>
    </div>

    <!-- 3D 渲染畫布容器 -->
    <div id="canvas-container"></div>

    <!-- 全息 HUD 與任務面板 -->
    <div id="hud">
        <div class="hud-header">
            <div class="hud-title">⚡ J.A.R. LAB // ARM-01</div>
            <div class="header-controls">
                <button id="lang-btn" class="lang-btn">🌐 EN / 中文</button>
                <div id="status-tag" class="hud-status">SYSTEM READY</div>
            </div>
        </div>

        <div class="mission-card">
            <div id="mission-title" class="mission-title">MISSION 01: 量子核心裝配</div>
            <div id="mission-desc" class="mission-guidance-text">🎯 移向前方發光核心</div>
            <div class="progress-bar-bg">
                <div id="phase-progress-bar" class="progress-bar-fill"></div>
            </div>
            <div id="view-hint" class="view-hint">💡 360° 拖曳視角 / 雙指縮放觀察工業細節</div>
        </div>
        <div></div>
    </div>

    <!-- 虛擬雙搖桿與動作按鈕 -->
    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone"><div id="knob-left" class="joy-knob"></div></div>
        <div id="joy-right" class="joystick-zone"><div id="knob-right" class="joy-knob"></div></div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <!-- 3A 結算面板 -->
    <div id="success-screen">
        <div class="trophy-icon">🏆</div>
        <h2 id="victory-title" class="success-title">MISSION ACCOMPLISHED</h2>
        <div id="new-record-badge" class="record-badge">NEW RECORD!</div>
        <div class="score-card">
            <div><div class="score-label">TIME</div><div id="final-time" class="score-val cyan">--</div></div>
            <div><div class="score-label">SCORE</div><div id="final-score" class="score-val white">--</div></div>
            <div><div class="score-label">RANK</div><div id="final-rank" class="score-val green">S</div></div>
        </div>
        <div class="btn-group">
            <button onclick="location.reload()" class="btn-action btn-cyan">🔄 再玩一次</button>
            <button id="btn-share" class="btn-action btn-outline">📤 分享戰績</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 1000);
            }
        }, 1200);
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
