<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R. 在手之上 3D ｜ Beyond the Hand</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 🌟 加入 Import Map 解決瀏覽器解析 "three" 模組路徑問題 -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
      }
    }
    </script>

    <!-- 全域支援腳本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- PostProcessing 泛光支援 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <!-- 彈出式模式切換選單 -->
    <div id="mode-selector" style="display:none; position:absolute; z-index:100; width:100%; height:100%; background:rgba(4,10,20,0.88); backdrop-filter:blur(15px); flex-direction:column; justify-content:center; align-items:center; transition: opacity 0.3s;">
        <h2 style="color:#00e5ff; font-size:24px; letter-spacing:3px; font-weight:800; margin-bottom: 5px;">⚡ 切換任務模式</h2>
        <p style="color:#8899aa; margin-bottom:25px; font-size:13px;">請選擇即將載入的自動化領域</p>
        <div style="display:flex; gap:16px; flex-wrap:wrap; justify-content:center;">
            <div class="mode-card" data-mode="kid" style="background:rgba(0,229,255,0.05); border:2px solid rgba(0,229,255,0.3); border-radius:12px; padding:20px; width:160px; cursor:pointer; text-align:center; transition:0.2s;">
                <div style="font-size:36px;">🍓</div>
                <h3 style="color:#fff; margin:10px 0 4px; font-size:15px;">兒童模式</h3>
                <p style="color:#8899aa; font-size:11px;">農業精準採摘</p>
            </div>
            <div class="mode-card" data-mode="advanced" style="background:rgba(255,145,0,0.05); border:2px solid rgba(255,145,0,0.3); border-radius:12px; padding:20px; width:160px; cursor:pointer; text-align:center; transition:0.2s;">
                <div style="font-size:36px;">📱</div>
                <h3 style="color:#fff; margin:10px 0 4px; font-size:15px;">進階模式</h3>
                <p style="color:#8899aa; font-size:11px;">3C 精密組裝</p>
            </div>
            <div class="mode-card" data-mode="research" style="background:rgba(255,61,0,0.05); border:2px solid rgba(255,61,0,0.3); border-radius:12px; padding:20px; width:160px; cursor:pointer; text-align:center; transition:0.2s;">
                <div style="font-size:36px;">🧪</div>
                <h3 style="color:#fff; margin:10px 0 4px; font-size:15px;">科研模式</h3>
                <p style="color:#8899aa; font-size:11px;">實驗室自動化</p>
            </div>
        </div>
        <button id="btn-close-modal" style="margin-top:25px; background:transparent; border:1px solid #557788; color:#8899aa; padding:6px 18px; border-radius:4px; font-size:12px; cursor:pointer;">關閉</button>
    </div>

    <!-- 任務簡報覆蓋層 -->
    <div id="briefing-overlay" style="display:none; position:absolute; z-index:90; width:100%; height:100%; background:rgba(0,0,0,0.8); flex-direction:column; justify-content:center; align-items:center;">
        <div style="border:2px solid #00e5ff; border-radius:12px; padding:25px 35px; text-align:center; background:rgba(4,12,24,0.92); box-shadow:0 0 30px rgba(0,229,255,0.2);">
            <h2 style="color:#00e5ff; letter-spacing:2px; margin-bottom:8px;">📋 任務簡報</h2>
            <p id="briefing-text" style="color:#fff; font-size:14px; margin-bottom:15px;"></p>
            <div style="font-size:22px; color:#ff9100; font-weight:bold;">倒數 <span id="briefing-countdown">3</span></div>
        </div>
    </div>

    <!-- 認證戰績卡 -->
    <div id="result-overlay" style="display:none; position:absolute; z-index:95; width:100%; height:100%; background:rgba(0,0,0,0.85); flex-direction:column; justify-content:center; align-items:center;">
        <div id="share-card" style="border:2px solid #ff9100; border-radius:12px; padding:35px; text-align:center; background:rgba(20,10,4,0.95); box-shadow:0 0 40px rgba(255,145,0,0.3); width: 300px; position:relative;">
            <h1 id="result-title" style="color:#fff; font-size:26px; margin-bottom:10px;">任務完成！</h1>
            <div style="font-size:64px; font-weight:900; margin:5px 0;" id="result-rank">S</div>
            <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:8px; margin-bottom:15px; font-size:13px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="color:#aaa;">耗時：</span><span id="result-time" style="color:#fff; font-weight:bold;">0 秒</span></div>
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="color:#aaa;">失誤：</span><span id="result-mistakes" style="color:#fff; font-weight:bold;">0 次</span></div>
                <div style="display:flex; justify-content:space-between;"><span style="color:#aaa;">認證碼：</span><span id="result-hash" style="color:#00e5ff; font-family:monospace; font-weight:bold;">JAR-8821</span></div>
            </div>
            <p id="result-achievement" style="color:#eab308; font-weight:bold; font-size:13px; margin-bottom:15px;"></p>
            <button id="btn-restart" style="background:#ff9100; border:none; color:#fff; padding:10px 20px; font-size:15px; border-radius:6px; cursor:pointer; font-weight:bold; width:100%;">重新挑戰</button>
        </div>
    </div>

    <!-- J.A.R. AI 對話視窗 -->
    <div id="jar-dialogue" style="display:none; position:absolute; bottom:130px; left:50%; transform:translateX(-50%); background:rgba(4,12,24,0.85); border:1px solid #00e5ff; border-left:4px solid #00e5ff; border-radius:6px; padding:12px 20px; width:85%; max-width:400px; z-index:80; backdrop-filter:blur(6px);">
        <div id="jar-title" style="color:#00e5ff; font-weight:bold; font-size:11px; margin-bottom:4px; display:flex; justify-content:space-between;">
            <span>J.A.R. 系統助理</span><span>在線</span>
        </div>
        <div id="jar-text" style="color:#fff; font-size:13px; font-family:monospace; min-height:36px; line-height:1.4;">...</div>
    </div>

    <div id="canvas-container"></div>
    
    <!-- 全息 HUD -->
    <div id="hud">
        <div class="hud-header">
            <div class="hud-title">⚡ J.A.R. 在手之上 3D</div>
            <div class="header-controls">
                <button id="btn-switch-mode" class="lang-btn" style="background:rgba(0,229,255,0.15); color:#00e5ff; border-color:#00e5ff; font-weight:bold;">🔀 切換模式</button>
                <button id="lang-btn" class="lang-btn">🌐 EN / 中文</button>
                <div id="status-tag" class="hud-status">系統就緒</div>
            </div>
        </div>
        <div class="mission-card">
            <div id="mission-title" class="mission-title">載入中...</div>
            <div id="mission-desc" class="mission-desc">請操作機械臂</div>
            <div id="view-hint" class="view-hint">💡 滑動旋轉視角 ｜ PC: WASD+QE+SPACE</div>
        </div>
        <div></div>
    </div>

    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone"><div id="knob-left" class="joy-knob"></div></div>
        <div id="joy-right" class="joystick-zone"><div id="knob-right" class="joy-knob"></div></div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
