<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020810">

    <!-- 🛡️ 企業級 CSP (嚴格限制來源、禁止 unsafe-eval、防止 Frame 劫持) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        connect-src 'self' blob:;
        font-src 'self' data:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    ">

    <!-- 🛡️ 跨來源隔離與防窺探 Headers (防 Spectre 側信道攻擊) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">

    <!-- 🔍 Google 網站驗證 -->
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

    <!-- 🌐 雙語全球 SEO 標籤 -->
    <title>J.A.R. 在手之上 3D | Beyond the Hand 3D</title>
    <meta name="description" content="J.A.R. Beyond the Hand 3D is an open-source, zero-asset 6-DoF robotic arm simulator featuring real-time CCD-IK, dynamic telemetry, and modal frequency FFT analysis. J.A.R. 聯合應用科學探索：高精度工業與科研機械臂 3D 模擬器。">
    <meta name="keywords" content="J.A.R., Joint Applied Research, 聯合應用科學探索, Beyond the Hand, Robotic Arm Simulator, Three.js, WebGL, CCD-IK, 6-DoF, Telemetry, FFT, 機械臂模擬器, 逆向運動學, 機器人學, 智能組裝, 工業自動化, 在手之上">
    <meta name="author" content="Jacky Law">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://jackylawck.github.io/JAR-Beyond-the-Hand/">

    <!-- 📱 Open Graph 社群分享卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jackylawck.github.io/JAR-Beyond-the-Hand/">
    <meta property="og:title" content="J.A.R. 在手之上 3D | Beyond the Hand 3D">
    <meta property="og:description" content="高保真 WebGL 6-DoF 工業與科研機械臂沙盒，支援實時 IK 逆向運動學求解與科研遙測數據採集。">
    <meta property="og:image" content="https://jackylawck.github.io/JAR-Beyond-the-Hand/jarBeyondtheHand512icon.png">

    <!-- 🐦 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://jackylawck.github.io/JAR-Beyond-the-Hand/">
    <meta name="twitter:title" content="J.A.R. Beyond the Hand 3D | Joint Applied Research">
    <meta name="twitter:description" content="High-fidelity 3D WebGL robotic arm simulator with real-time CCD-IK and dynamic FFT telemetry.">
    <meta name="twitter:image" content="https://jackylawck.github.io/JAR-Beyond-the-Hand/jarBeyondtheHand512icon.png">

    <!-- 🔍 Google 結構化資料 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "J.A.R. Beyond the Hand 3D",
      "alternateName": "J.A.R. 在手之上 3D - 聯合應用科學探索",
      "url": "https://jackylawck.github.io/JAR-Beyond-the-Hand/",
      "description": "An open-source, zero-asset WebGL 6-DoF kinematic robotic arm simulator featuring real-time CCD-IK, FFT vibration telemetry, and 3-tier career scenarios.",
      "applicationCategory": "EducationalApplication, SimulationApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires WebGL / HTML5.",
      "inLanguage": ["en", "zh-HK", "zh-TW"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Jacky Law"
      }
    }
    </script>

    <!-- 📲 PWA 與圖示連結 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="jarBeyondtheHand192icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="jarBeyondtheHand512icon.png">
    <link rel="apple-touch-icon" href="jarBeyondtheHand192icon.png">

    <!-- 🌟 Import Map 模組路徑映射 -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
    </script>

    <style>
        :root {
            --color-primary: #00e5ff;
            --color-primary-dim: rgba(0, 229, 255, 0.18);
            --color-primary-glow: rgba(0, 229, 255, 0.6);
            --color-accent: #ff9100;
            --color-bg-dark: rgba(3, 10, 22, 0.92);
            --color-border: rgba(0, 229, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            word-break: normal;
            overflow-wrap: break-word;
            white-space: normal;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020810;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            position: fixed;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 🌟 1. 頂部極簡全息即時數據長條 */
        #top-telemetry-bar {
            position: absolute;
            top: calc(env(safe-area-inset-top, 10px) + 6px);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 520px;
            background: var(--color-bg-dark);
            border: 1px solid var(--color-border);
            border-radius: 18px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .bar-left {
            display: flex;
            gap: 6px;
            font-size: 11px;
            color: #fff;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bar-left span b { color: var(--color-primary); }
        .bar-left .err-tag { color: #ff5555; font-weight: bold; }

        .bar-right {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }

        .mini-btn {
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid var(--color-primary);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .mini-btn:active { transform: scale(0.95); }

        /* 🌟 2. 單行緊湊任務提示 */
        #compact-mission-tip {
            position: absolute;
            top: calc(env(safe-area-inset-top, 10px) + 46px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(4, 12, 24, 0.75);
            border: 1px solid rgba(0, 229, 255, 0.25);
            color: #00e5ff;
            font-size: 11px;
            padding: 3px 12px;
            border-radius: 12px;
            z-index: 25;
            backdrop-filter: blur(8px);
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        /* 🌟 3. AI 提示框 (短暫提示後淡出) */
        #jar-dialogue {
            position: absolute;
            bottom: clamp(120px, 16vh, 140px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-bg-dark);
            border: 1px solid var(--color-primary);
            border-radius: 8px;
            padding: 8px 14px;
            width: 86%;
            max-width: 400px;
            z-index: 20;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: opacity 0.8s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        #jar-title { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: var(--color-primary); margin-bottom: 2px; }
        #jar-text { color: #fff; font-size: 12px; line-height: 1.3; }

        /* 🌟 4. 雙搖桿與 GRIP 按鈕 */
        .controls-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }

        #joy-left {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            left: max(20px, env(safe-area-inset-left, 20px));
            width: clamp(80px, 11vw, 110px);
            height: clamp(80px, 11vw, 110px);
            background: rgba(0, 229, 255, 0.05);
            border: 2px dashed rgba(0, 229, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }

        #joy-right {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            right: clamp(95px, 13vw, 140px);
            width: clamp(80px, 11vw, 110px);
            height: clamp(80px, 11vw, 110px);
            background: rgba(0, 229, 255, 0.05);
            border: 2px dashed rgba(0, 229, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }

        .joy-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(34px, 4.2vw, 44px);
            height: clamp(34px, 4.2vw, 44px);
            background: radial-gradient(circle, #00e5ff 0%, #006688 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            pointer-events: none;
        }

        #btn-grip {
            position: absolute;
            bottom: max(22px, env(safe-area-inset-bottom, 22px));
            right: max(16px, env(safe-area-inset-right, 16px));
            width: clamp(66px, 8.5vw, 82px);
            height: clamp(66px, 8.5vw, 82px);
            background: radial-gradient(circle, #ff9100 0%, #c83b00 100%);
            border: 2px solid #ffab40;
            border-radius: 50%;
            color: #fff;
            font-weight: 900;
            font-size: clamp(13px, 1.5vw, 16px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 145, 0, 0.45);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.08s ease;
        }

        #btn-grip:active { transform: scale(0.9); }

        /* 模式切換彈窗 */
        #mode-selector {
            display: none;
            position: absolute;
            top: 0; left: 0;
            z-index: 100;
            width: 100%; height: 100%;
            background: rgba(4, 10, 20, 0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #mode-selector h2 { color: #00e5ff; font-size: 20px; margin-bottom: 4px; }
        #mode-selector p { color: #8899aa; font-size: 12px; margin-bottom: 18px; }
        .mode-cards-wrap { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .mode-card {
            background: rgba(0, 229, 255, 0.05);
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 14px;
            width: 130px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .mode-card:hover { border-color: #00e5ff; background: rgba(0, 229, 255, 0.12); }
        .mode-card .icon { font-size: 28px; }
        .mode-card h3 { color: #fff; font-size: 13px; margin: 6px 0 2px; }
        .mode-card p { color: #8899aa; font-size: 10px; }
        #btn-close-modal { margin-top: 16px; background: transparent; border: 1px solid #557788; color: #8899aa; padding: 5px 16px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        @media (orientation: landscape) {
            #compact-mission-tip { top: calc(env(safe-area-inset-top, 10px) + 38px); font-size: 10px; }
            #jar-dialogue { bottom: auto; top: max(10px, env(safe-area-inset-top, 10px)); left: 50%; width: auto; min-width: 260px; max-width: 380px; padding: 6px 12px; }
            #jar-text { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div id="mode-selector">
        <h2 id="modal-title">⚡ 切換任務模式</h2>
        <p id="modal-desc">請選擇即將載入的自動化領域</p>
        <div class="mode-cards-wrap">
            <div class="mode-card" data-mode="kid">
                <div class="icon">🍓</div>
                <h3 id="mode-opt-kid-title">兒童模式</h3>
                <p id="mode-opt-kid-desc">農業精準採摘</p>
            </div>
            <div class="mode-card" data-mode="advanced">
                <div class="icon">📱</div>
                <h3 id="mode-opt-adv-title">進階模式</h3>
                <p id="mode-opt-adv-desc">3C 精密組裝</p>
            </div>
            <div class="mode-card" data-mode="research">
                <div class="icon">🧪</div>
                <h3 id="mode-opt-res-title">科研模式</h3>
                <p id="mode-opt-res-desc">實驗室自動化</p>
            </div>
        </div>
        <button id="btn-close-modal">關閉</button>
    </div>

    <div id="canvas-container"></div>
    
    <!-- 頂部單行數據列 -->
    <div id="top-telemetry-bar">
        <div class="bar-left">
            <span>X:<b id="top-val-x">0.00</b></span>
            <span>Y:<b id="top-val-y">0.00</b></span>
            <span>Z:<b id="top-val-z">0.00</b></span>
            <span>R:<b id="top-val-r">0.00</b></span>
            <span>Err:<b id="top-val-err" class="err-tag">0.00</b></span>
        </div>
        <div class="bar-right">
            <button id="btn-switch-mode" class="mini-btn">🔀 模式</button>
            <button id="lang-btn" class="mini-btn">🌐 EN</button>
        </div>
    </div>

    <div id="compact-mission-tip">🍓 初熟草莓 ｜ 移動夾爪至上方按下 GRIP</div>

    <div id="jar-dialogue">
        <div id="jar-title">
            <span id="jar-title-text">J.A.R. 系統助理</span>
            <span id="jar-status-tag" style="color:#00ff66;">● 在線</span>
        </div>
        <div id="jar-text">你好！我已經準備好幫你摘士多啤梨啦～ 🍓</div>
    </div>

    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone"><div id="knob-left" class="joy-knob"></div></div>
        <div id="joy-right" class="joystick-zone"><div id="knob-right" class="joy-knob"></div></div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <script type="module" src="src/main.js"></script>
    <script>
        setTimeout(() => {
            const jar = document.getElementById('jar-dialogue');
            if (jar) jar.style.opacity = '0';
        }, 5000);
    </script>
</body>
</html>
