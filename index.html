<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R. 在手之上 3D ｜ Beyond the Hand 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 全息 HUD -->
    <div id="hud">
        <div class="hud-header">
            <div class="hud-title">⚡ J.A.R. LAB // ARM-01</div>
            <div class="header-controls">
                <button id="lang-btn" class="lang-btn">🌐 EN / 中文</button>
                <div id="status-tag" class="hud-status">SYSTEM READY</div>
            </div>
        </div>
        <div class="mission-card">
            <div id="mission-title" class="mission-title">MISSION 01: 量子核心裝配</div>
            <div id="mission-desc" class="mission-desc">🎯 移向前方發光核心</div>
            <div id="view-hint" class="view-hint">💡 360° 拖曳視角 / 雙指縮放觀察工業細節</div>
        </div>
        <div></div>
    </div>

    <!-- 虛擬雙搖桿與動作按鈕 -->
    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone"><div id="knob-left" class="joy-knob"></div></div>
        <div id="joy-right" class="joystick-zone"><div id="knob-right" class="joy-knob"></div></div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <!-- 🌟 關鍵：必須帶 type="module" 才能加載 src/main.js -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
