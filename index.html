<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00e5ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="在手之上">
    <title>J.A.R. 在手之上 3D ｜ DUM-E 手遊</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- 史塔克全息 HUD -->
    <div id="hud">
        <div class="hud-header">
            <div class="hud-title">⚡ STARK LAB // DUM-E</div>
            <div id="status-tag" class="hud-status">SYSTEM READY</div>
        </div>
        <div class="mission-card">
            <div class="mission-title">MISSION 01: 方舟反應爐</div>
            <div id="mission-text" class="mission-desc">推動搖桿抓住核心，安裝至右側光圈槽位！</div>
        </div>
        <div></div>
    </div>

    <!-- 手機虛擬雙搖桿與夾爪按鈕 -->
    <div class="controls-overlay">
        <div id="joy-left" class="joystick-zone">
            <div id="knob-left" class="joy-knob"></div>
        </div>
        <div id="joy-right" class="joystick-zone">
            <div id="knob-right" class="joy-knob"></div>
        </div>
        <div id="btn-grip" class="action-btn">GRIP</div>
    </div>

    <!-- ES Module 模組化入口 -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
